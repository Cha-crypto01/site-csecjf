<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — CSECJF</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'image/accueil/favicon-csecjf.png' %}">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; }
    .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0b1120 0%, #004aad 100%); }
    .login-box { background: white; border-radius: 1.25rem; padding: 3rem; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-box .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .login-box .logo img { height: 2.5rem; width: auto; border-radius: 6px; }
    .login-box h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.5rem; font-weight: 800; color: #0b1120; }
    .login-box p.sub { color: #8898aa; font-size: 0.9rem; margin-bottom: 2rem; }
    .login-box input { width: 100%; padding: 0.9rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 0.75rem; font-size: 1rem; margin-bottom: 1rem; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s; }
    .login-box input:focus { outline: none; border-color: #04c0ff; }
    .login-box button { width: 100%; padding: 0.9rem; border: none; border-radius: 0.75rem; background: #04c0ff; color: white; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
    .login-box button:hover { background: #03a8e0; }
    .login-error { background: #fef2f2; color: #ef4444; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.85rem; margin-bottom: 1rem; display: {% if messages %}block{% else %}none{% endif %}; }
    .login-footer { text-align: center; margin-top: 1.5rem; color: #8898aa; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="logo">
        <img src="{% static 'image/shared/Logo-csecjf.png' %}" alt="CSECJF">
        <h1>CSECJF</h1>
      </div>
      <p class="sub">Espace réservé</p>

      {% if messages %}
        {% for message in messages %}
          <div class="login-error">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="email" name="email" placeholder="votre@email.sn" required autofocus>
        <input type="password" name="password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
      </form>

      <div class="login-footer">
        Centre Socio-Éducatif et Culturel des Jeunes et des Femmes de Guinaw Rails Sud
      </div>
    </div>
  </div>
</body>
</html>
